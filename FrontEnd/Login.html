<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="css/padrao.css">
        <link rel="stylesheet" href="css/login.css">
    </head>
    <body>    

        <header class="header">

            <nav class="navHeader">
                <div class="navHeader-logo">
                   <img src="img/logo.png" alt="Logo"> 
                </div>
                
                <div class="navHeader-links">
                    <a href="Landing.html" class="navHeader-link"> Home </a>
                    <a href="Login.html" class="navHeader-link caixa"> Entrar </a>
                </div>
            </nav>
            
        </header>
            
        <main class="content">

            <form action="action_page.php" method="post">

                <div class="imgcontainer">
                    <img src="img/img_avatar2.png" alt="Avatar" class="avatar">
                </div>

                <div class="container">

                    <h1>Login</h1>
                    <hr>

                    <label for="uname"><b>Email</b></label>
                    <input type="text" placeholder="Entre com o Email" name="uname" required>

                    <label for="psw"><b> Senha </b></label>
                    <input type="password" placeholder="Entre com a Senha" name="psw" required>

                    <button type="submit"> Entrar </button>
                    
                    <label>
                        <input type="checkbox" checked="checked" name="remember"> Lembre-se de Mim
                    </label>
                </div>

                <div class="container" style="background-color:#f1f1f1">
                    <button type="button" class="cancelbtn">Cancelar</button>
                    <span class="psw">Não possui conta? <a href="Cadastro.html">Cadastre-se</a></span>
                </div>
            
            </form>

        </main>

        <footer class="footer">

            <div class="footerContent">

                <div class="footer-sobre">
                    <img src="img/logo.png" alt="Logo" class="footer-logo">
                </div>

                <div class="footer-slogan">
                    <p>Onde cada viagem encontra um lar.</p>
                </div>

                <div class="footer-info">
                    <div class="footer-endereco">
                        <p>Av. das Palmeiras, 2450</p>
                        <p>Belo Horizonte - MG, CEP 30140-110</p>
                        <p>(31) 3333-5678 • contato@homefly.com</p>
                    </div>
                </div>

            </div>
            
        </footer>
    </body>

</html>
