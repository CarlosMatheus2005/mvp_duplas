<!DOCTYPE html>

        <link rel="stylesheet" href="css/padrao.css">

    <body>     
        <header class="header">
            
            <nav class="navHeader">
                <div class="navHeader-logo">
                   <img src="img/logo.png" alt="Logo"> 
                </div>
                
                <div class="navHeader-links">
                    <a href="Landing.html" class="navHeader-link"> Home </a>

                </div>
            </nav>

        </header>

        <main class="content">

            <form action="action_page.php" method="post">

                <div class="container">
                    <h1>Cadastro</h1>
                    <p>Preencha os dados abaixo para criar sua conta.</p>
                    <hr>

                    <label for="email"><b>Email</b></label>
                    <input type="text" placeholder="Entre com o Email" name="email" required>

                    <label for="psw"><b>Senha</b></label>
                    <input type="password" placeholder="Entre com a Senha" name="psw" required>

                    <label for="psw-repeat"><b>Repita a Senha</b></label>
                    <input type="password" placeholder="Repita a Senha" name="psw-repeat" required>

                    <label>
                        <input type="checkbox" checked="checked" name="remember"> Lembre-se de Mim
                    </label>

                    <p>Ao criar uma conta, você concorda com nossos <a href="#">Termos e Privacidade</a>.</p>

                    <div class="clearfix">
                        <button type="button" class="cancelbtn">Cancelar</button>
                        <button type="submit" class="signupbtn">Cadastrar</button>
                    </div>
                </div>

                <div class="container" style="background-color:#f1f1f1">
                    <span class="psw">Já tem uma conta? <a href="Login.html">Entre!</a></span>
                </div>

            </form>
        </main>

       <footer class="footer">

            <div class="footerContent">

                <div class="footer-sobre">

                </div>
